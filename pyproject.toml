[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp2deck-agent"
version = "0.2.1"
description = "RFP to Proposal Deck Agent (Streamlit + LangGraph + OpenAI)"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
    "openai>=1.40.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "tiktoken>=0.7.0",
    "streamlit>=1.32",
    "python-docx>=1.1.2",
    "PyMuPDF>=1.24.7",
    "openpyxl>=3.1.5",
    "faiss-cpu>=1.8.0.post1",
    "numpy>=1.26",
    "msal>=1.30.0",
    "requests>=2.32.0",
    "python-pptx>=0.6.23",
    "rich>=13.7",
]

[tool.setuptools]
packages = ["rfp2deck"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
